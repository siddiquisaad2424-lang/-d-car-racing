<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D Car Racing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }
        /* Loading Screen */
        #loading-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f1f1f, #000);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        #loading-screen h1 {
            font-size: 3.5rem;
            color: #ffcc00;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(255, 204, 0, 0.5);
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .progress-bar-container {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #555;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: #ffcc00;
            transition: width 0.1s linear;
        }
        #loading-text {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #aaa;
        }

        /* Game Container */
        #game-container {
            display: none;
            position: relative;
            width: 400px;
            height: 600px;
            background: #333;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        .road {
            position: absolute;
            width: 100%;
            height: 1200px;
            background: #444;
            top: -600px;
            animation: roadAnim 1s linear infinite;
        }
        .lane-marker {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 600px;
            background: repeating-linear-gradient(
                to bottom,
                #fff,
                #fff 40px,
                transparent 40px,
                transparent 80px
            );
        }
        @keyframes roadAnim {
            0% { top: -600px; }
            100% { top: 0px; }
        }

        /* Cars */
        .car {
            position: absolute;
            width: 50px;
            height: 90px;
            background: #ff3333;
            border-radius: 8px;
            bottom: 20px;
            left: 175px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .car::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 8px;
            width: 34px;
            height: 20px;
            background: #222;
            border-radius: 4px;
        }
        .enemy {
            position: absolute;
            width: 50px;
            height: 90px;
            background: #3388ff;
            border-radius: 8px;
            top: -100px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .enemy::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 8px;
            width: 34px;
            height: 20px;
            background: #222;
            border-radius: 4px;
        }

        /* UI Panel */
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 5;
            text-shadow: 1px 1px 2px #000;
        }
        #game-title {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 1px;
            z-index: 5;
        }

        /* Game Over Screen */
        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #game-over h2 {
            font-size: 2.5rem;
            color: #ff3333;
            margin-bottom: 15px;
        }
        #game-over button {
            padding: 10px 20px;
            font-size: 1.1rem;
            background: #ffcc00;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #111;
        }
        #game-over button:hover {
            background: #e6b800;
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 5;
            padding: 0 20px;
        }
        .ctrl-btn {
            width: 70px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
        }
        .ctrl-btn:active {
            background: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <!-- Loading Screen (10 Seconds with DADA RACING) -->
    <div id="loading-screen">
        <h1>DADA RACING</h1>
        <div class="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        <div id="loading-text">Loading... 0%</div>
    </div>

    <!-- Main Game Screen -->
    <div id="game-container">
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div>Speed: <span id="speed">60</span> KM/H</div>
        </div>
        <div id="game-title">D Car Racing</div>
        
        <div class="road">
            <div class="lane-marker"></div>
        </div>

        <div class="car" id="player"></div>
        <div class="enemy" id="enemy"></div>

        <div class="controls">
            <button class="ctrl-btn" onclick="moveLeft()">◀</button>
            <button class="ctrl-btn" onclick="moveRight()">▶</button>
        </div>

        <div id="game-over">
            <h2>CRASH!</h2>
            <p style="margin-bottom: 20px; font-size: 1.2rem;">Final Score: <span id="final-score">0</span></p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        // 10 Seconds Loading Logic
        let progressBar = document.getElementById('progress-bar');
        let loadingText = document.getElementById('loading-text');
        let loadingScreen = document.getElementById('loading-screen');
        let gameContainer = document.getElementById('game-container');

        let progress = 0;
        let totalTime = 10000; // 10 seconds in milliseconds
        let intervalTime = 100; // Update every 100ms
        let increment = (intervalTime / totalTime) * 100;

        let loadTimer = setInterval(() => {
            progress += increment;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadTimer);
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    gameContainer.style.display = 'block';
                    startGameLoop();
                }, 500);
            }
            progressBar.style.width = progress + '%';
            loadingText.innerText = `Loading... ${Math.floor(progress)}%`;
        }, intervalTime);

        // Game Variables & Logic
        let player = document.getElementById('player');
        let enemy = document.getElementById('enemy');
        let scoreDisplay = document.getElementById('score');
        let finalScoreDisplay = document.getElementById('final-score');
        let gameOverScreen = document.getElementById('game-over');

        let playerX = 175; // Center lane
        let enemyX = 175;
        let enemyY = -100;
        let score = 0;
        let isGameOver = false;
        let gameInterval;

        const lanes = [75, 175, 275]; // Left, Center, Right lanes
        let playerLaneIndex = 1;

        function moveLeft() {
            if (playerLaneIndex > 0) {
                playerLaneIndex--;
                playerX = lanes[playerLaneIndex];
                player.style.left = playerX + 'px';
            }
        }

        function moveRight() {
            if (playerLaneIndex < lanes.length - 1) {
                playerLaneIndex++;
                playerX = lanes[playerLaneIndex];
                player.style.left = playerX + 'px';
            }
        }

        // Keyboard controls support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
        });

        function startGameLoop() {
            isGameOver = false;
            score = 0;
            enemyY = -100;
            enemyLaneIndex = Math.floor(Math.random() * 3);
            enemyX = lanes[enemyLaneIndex];
            
            gameInterval = setInterval(() => {
                if (isGameOver) return;

                // Move enemy car down
                enemyY += 6;
                enemy.style.top = enemyY + 'px';
                enemy.style.left = enemyX + 'px';

                // Reset enemy when it goes off screen
                if (enemyY > 600) {
                    enemyY = -100;
                    let newLaneIndex;
                    do {
                        newLaneIndex = Math.floor(Math.random() * 3);
                    } while (newLaneIndex === playerLaneIndex); // Keep it slightly playable
                    enemyLaneIndex = newLaneIndex;
                    enemyX = lanes[enemyLaneIndex];
                    score += 10;
                    scoreDisplay.innerText = score;
                }

                // Collision detection
                // Player is at bottom: bottom = 20px -> top ~ 490 to 580
                if (enemyY >= 470 && enemyY <= 570 && playerLaneIndex === enemyLaneIndex) {
                    isGameOver = true;
                    clearInterval(gameInterval);
                    finalScoreDisplay.innerText = score;
                    gameOverScreen.style.display = 'flex';
                }

            }, 20);
        }

        function restartGame() {
            gameOverScreen.style.display = 'none';
            playerLaneIndex = 1;
            playerX = lanes[playerLaneIndex];
            player.style.left = playerX + 'px';
            startGameLoop();
        }
    </script>
</body>
</html>
